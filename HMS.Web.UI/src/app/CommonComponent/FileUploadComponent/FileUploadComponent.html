<style>
    .upload-wrapper {
        width: 100%;
        text-align: center;
        padding: 25px;
        border: 2px dashed #e5e5e5;
        border-radius: 10px;
        background: #fafafa;
    }

    /* ---------------- UPLOAD BOX ---------------- */

    .upload-box {
        width: 270px;
        height: 160px;
        margin: auto;
        border: 2px dashed #b7c7e6;
        border-radius: 14px;
        background: #fff;
        cursor: pointer;
        transition: 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

        .upload-box:hover {
            border-color: #0d6efd;
            background: #f8fbff;
        }

    /* ---------------- CONTENT ---------------- */

    .upload-content {
        text-align: center;
    }

    /* ---------------- ICON ---------------- */

    .upload-icon {
        margin-bottom: 15px;
    }

        .upload-icon i {
            font-size: 34px;
            color: #4b4be0;
        }

    /* ---------------- TEXT ---------------- */

    .upload-title {
        font-size: 17px;
        font-weight: 500;
        color: #5f73b3;
        margin-bottom: 10px;
    }

    .upload-file-name {
        font-size: 15px;
        color: #666;
    }

    /* ---------------- HIDDEN INPUT ---------------- */

    .file-input {
        display: none;
    }
    .remove-file-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 50%;
        background: #dc3545;
        color: white;
        cursor: pointer;
        z-index: 10;
    }

        .remove-file-btn:hover {
            background: #b02a37;
        }

        .remove-file-btn i {
            font-size: 14px;
        }
</style>

<div class="upload-wrapper">

    <!-- Upload Area -->
    <div class="upload-box" (click)="triggerFileBrowse()">

        <input #fileInput
               type="file"
               class="file-input"
               (click)="$event.stopPropagation()"
               (change)="fileChangeEvent($event)" />

        <div class="upload-content">

            <div class="upload-icon">
                <i class="fa fa-upload"></i>
            </div>

            <div class="upload-title">
                Browse file to upload
            </div>

            <div class="upload-file-name">
                {{ showbar ? imagedata : 'No File Chosen' }}
            </div>

        </div>
        <!-- Remove button -->
        <button *ngIf="showbar"
                type="button"
                class="remove-file-btn"
                (click)="removeFile($event)">
            <i class="fa fa-times"></i>
        </button>
    </div>

</div>
