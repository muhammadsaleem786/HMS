<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-6">
      <div class="card shadow rounded">
        <div class="card-body">
          <form [formGroup]="Form" novalidate (ngSubmit)="forgotpass(Form.valid)" action="">
            <div class="text-center mb-4">
              <img class="img-fluid" style="max-width: 150px;" src="assets/app/media/img/HMS.png" alt="Alternate Text">
            </div>

            <h4 class="text-center mb-3">Forgot your password?</h4>

            <div class="mb-3 text-danger font-14">
              <label style="font-weight: 500; font-size: 15px;"></label>
            </div>

            <div class="form-group">
              <label style="font-weight: 500; font-size: 15px;">Email Address</label>
              <input 
                class="form-control" 
                formControlName="Email" 
                type="text" 
                maxlength="250" 
                placeholder="Email" 
                [(ngModel)]="model.Email"
              >
              <small 
                class="form-text text-danger" 
                *ngIf="Form.controls.Email.hasError('pattern') && !Form.controls.Email.hasError('required')">
                Please enter valid email.
              </small>
              <small 
                class="form-text text-danger" 
                *ngIf="Form.controls.Email.hasError('required') && submitted">
                This value is required.
              </small>
            </div>

            <div class="text-center">
              <button class="btn btn-primary px-4" type="submit" value="Verify Email">Continue</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
