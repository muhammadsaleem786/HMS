<div class="row align-items-center mb-3">
    <div class="col-md-2">
        <h2 class="grid-heading mb-0">Expire</h2>
    </div>

    <div class="col-md-3">

    </div>

    <div class="col-md-2">
        <select [(ngModel)]="selectedValue"
                (change)="Refresh()"
                class="form-control">
            <option *ngFor="let item of CategoryList" [value]="item.ID">
                {{ item.Value }}
            </option>
        </select>
    </div>

    <div class="col-md-2">
        <select [(ngModel)]="selectedVandorValue"
                (change)="Refresh()"
                class="form-control">
            <option *ngFor="let item of VendorList" [value]="item.ID">
                {{ item.Name }}
            </option>
        </select>
    </div>

    <div class="col-md-2">
        <select [(ngModel)]="selectedBrandValue"
                (change)="Refresh()"
                class="form-control">
            <option *ngFor="let item of BrandList" [value]="item.ID">
                {{ item.Value }}
            </option>
        </select>
    </div>

    <div class="col-md-1 text-right">
        <a class="btn btn-light" routerLink="/home/Item">Back</a>
    </div>
</div>

<div class="margin-t-68 removeAction">

    <div class="Cardview search_onTop px-3 pt-0">
        <div class="TableView">
            <app-pagination [PModel]="PModel" [PConfig]="PConfig" [PData]="ItemList" (pageChange)="GetList()" (AddOrEditEvent)="AddRecord($event)" (ViewEvent)="View($event)" (GoBackEvent)="GoBack($event)" (DeleteEvent)="Delete($event)" (ExportEvent)="ExportData($event)"></app-pagination>
        </div>
    </div>
</div>
