 <div class="row m-0 mb-2">
        <div class="col-sm-8">
        <h2 class="grid-heading margin-t-15 mb-2"> Restock</h2>
         <div class="form-group d-flex" style="width: 433px; padding-left: 92px; gap: 12px; position: absolute; top: 15px; left: 370px;">
            <label>Type</label>
                    <select [(ngModel)]="selectedValue" (change)="getFilterData()" class="form-control">
                        <option *ngFor="let item of CategoryList" [value]="item.ID">
                            {{item.Value}}
                        </option>
                    </select>
        </div>

    </div>
    <div class="col-sm-4 text-right flex-row flex-end">

        <a class="btn btn-light mr-1 mt-2" routerLink="/home/Item">Back</a>
     
    </div>
    </div>

<div class="margin-t-68 removeAction">
   
    <div class="Cardview search_onTop px-3 pt-0">
        <div class="TableView">
            <app-pagination [PModel]="PModel" [PConfig]="PConfig" [PData]="ItemList" (pageChange)="GetList()" (AddOrEditEvent)="AddRecord($event)" (ViewEvent)="View($event)" (GoBackEvent)="GoBack($event)" (DeleteEvent)="Delete($event)" (ExportEvent)="ExportData($event)"></app-pagination>
        </div>
    </div>
</div>
