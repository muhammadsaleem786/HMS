<div class="col-sm-12 AddRoleWraper">
    <div class="row headSection paginationHead">
        <div class="col-sm-8 no-padding">
            <h3 class="page-heading mt-d-inline-block" *ngIf="IsEdit">
                Update Equipment Maintenance
                <a routerLink="/home/setup"><i class="fa fa-arrow-circle-left"></i></a>
            </h3>
            <h3 class="page-heading mt-d-inline-block" *ngIf="IsEdit==false">
                New Equipment Maintenance
                <a routerLink="/home/setup"><i class="fa fa-arrow-circle-left"></i></a>
            </h3>
        </div>
    </div>
    <div class="row Cardview padding-20">
        <div class="col-sm-12 mt-2">
            <form [formGroup]="Form1" novalidate (ngSubmit)="SaveOrUpdate(Form1.valid)">
                <div class="row">
                    <div class="col-sm-6">


                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Equipment Name</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <input type="text" id="" formControlName="EquipmentName" [(ngModel)]="model.EquipmentName" class="form-control form-control-sm form-control-alternative" />
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Department</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <input type="text" id="" formControlName="Department" [(ngModel)]="model.Department" class="form-control form-control-sm form-control-alternative" />
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Purchase Date</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <Datetime-Component formControlName="PurchaseDate" placeholder="DD/MM/YYYY" (DateChangeValue)="onDateChanged($event)" [(ngModel)]="model.PurchaseDate" [style.pointer-events]="true">
                                    </Datetime-Component>
                                </div>
                            </div>
                        </div>



                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Installation Date</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <Datetime-Component formControlName="InstallationDate" placeholder="DD/MM/YYYY" (DateChangeValue)="onDateChanged($event)" [(ngModel)]="model.InstallationDate" [style.pointer-events]="true">
                                    </Datetime-Component>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Warranty Period</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <Datetime-Component formControlName="WarrantyPeriod" placeholder="DD/MM/YYYY" (DateChangeValue)="onDateChanged($event)" [(ngModel)]="model.WarrantyPeriod" [style.pointer-events]="true">
                                    </Datetime-Component>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Condemnation Date</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <Datetime-Component formControlName="CondemnationDate" placeholder="DD/MM/YYYY" (DateChangeValue)="onDateChanged($event)" [(ngModel)]="model.CondemnationDate" [style.pointer-events]="true">
                                    </Datetime-Component>
                                </div>
                            </div>
                        </div>



                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Maintenance Date</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <Datetime-Component formControlName="MaintenanceDate" placeholder="DD/MM/YYYY" (DateChangeValue)="onDateChanged($event)" [(ngModel)]="model.MaintenanceDate" [style.pointer-events]="true">
                                    </Datetime-Component>
                                </div>
                            </div>
                        </div>


                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Calibration Date</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <Datetime-Component formControlName="CalibrationDate" placeholder="DD/MM/YYYY" (DateChangeValue)="onDateChanged($event)" [(ngModel)]="model.CalibrationDate" [style.pointer-events]="true">
                                    </Datetime-Component>
                                </div>
                            </div>
                        </div>


                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Service Repair Date</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <Datetime-Component formControlName="ServiceRepairDate" placeholder="DD/MM/YYYY" (DateChangeValue)="onDateChanged($event)" [(ngModel)]="model.ServiceRepairDate" [style.pointer-events]="true">
                                    </Datetime-Component>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Supplier Name And Address</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <textarea type="text" class="form-control m-input" placeholder="Supplier Name And Address" formControlName="SupplierNameAndAddress" [(ngModel)]="model.SupplierNameAndAddress"></textarea>

                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Remark</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <textarea type="text" class="form-control m-input" placeholder="Remarks" formControlName="Remarks" [(ngModel)]="model.Remarks"></textarea>

                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Scheduled Maintenance</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <input type="checkbox" class="" formControlName="ScheduledMaintenance" [(ngModel)]="model.ScheduledMaintenance">

                                </div>
                            </div>
                        </div>





                    </div>
                    <div class="col-sm-4">
                        <div class="img-box">
                            <div class="col-sm-12" *ngIf="model.Attachment!=''">
                                <img [src]="AttachImage" style="width: 80px;height: 80px;border-radius: 50%;display: table;" />
                            </div>
                            <File-Component class="UploadActnWrap" [(ngModel)]="model.Attachment" (ClearModel)="ClearImageUrl()" (FileNameEvent)="getImageUrlName($event)" (IsNewFileEvents1)="IsNewImageEvent($event)" [ImageWithAddress]="true" [ngModelOptions]="{standalone:true}"></File-Component>
                        </div>
                    </div>
                </div>
                <div class="modalfooter border-top mt-3">
                    <div class="row mt-2">
                        <div class="col-sm-6">
                            <button type="button" class="btn btn-red btnDel pull-left" *ngIf="IsEdit && ControlRights.DeleteRights" (click)="Delete()">Delete</button>

                        </div>

                        <div class="col-sm-6 text-right">
                            <button type="submit" class="btn btn-primary" *ngIf="!IsEdit && ControlRights.CreateRights">Save</button>
                            <button type="submit" class="btn btn-primary" *ngIf="IsEdit && ControlRights.EditRights">Update</button>
                            <button type="button" class="btn btn-light ml-2" routerLink="/home/EquipmentMaintenance">Cancel</button>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
