<div class="col-sm-12 AddRoleWraper">
    <div class="row headSection paginationHead">
        <div class="col-sm-8 no-padding">
            <h3 class="page-heading mt-d-inline-block" *ngIf="IsEdit">
                Update Sentinel Event
                <a routerLink="/home/setup"><i class="fa fa-arrow-circle-left"></i></a>
            </h3>
            <h3 class="page-heading mt-d-inline-block" *ngIf="IsEdit==false">
                New Sentinel Event
                <a routerLink="/home/setup"><i class="fa fa-arrow-circle-left"></i></a>
            </h3>
        </div>
    </div>
    <div class="row Cardview padding-20">
        <div class="col-sm-12 mt-2">
            <form [formGroup]="Form1" novalidate (ngSubmit)="SaveOrUpdate(Form1.valid)">
                <div class="row">
                    <div class="col-sm-6">
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Event Date*</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <Datetime-Component formControlName="EventDate" placeholder="DD/MM/YYYY" (DateChangeValue)="onDateChanged($event)" [(ngModel)]="model.EventDate" [style.pointer-events]="true">
                                    </Datetime-Component>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Event Type</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <input type="text" id="" formControlName="EventType" [(ngModel)]="model.EventType" class="form-control form-control-sm form-control-alternative" />
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Event Description</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <textarea type="text" class="form-control m-input" placeholder="Event Description" formControlName="EventDescription" [(ngModel)]="model.EventDescription"></textarea>

                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Immediate Action Taken</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <textarea type="text" class="form-control m-input" placeholder="Immediate Action Taken" formControlName="ImmediateActionTaken" [(ngModel)]="model.ImmediateActionTaken"></textarea>

                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Outcome</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <textarea type="text" class="form-control m-input" placeholder="Outcome" formControlName="OutcomeDetails" [(ngModel)]="model.OutcomeDetails"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username"> Reported By</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <input type="text" id="" formControlName="ReportedBy" [(ngModel)]="model.ReportedBy" class="form-control form-control-sm form-control-alternative" />
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username">Reviewed By Clinical Manager</label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <input type="text" id="" formControlName="ReviewedByClinicalManager" [(ngModel)]="model.ReviewedByClinicalManager" class="form-control form-control-sm form-control-alternative" />
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-4 text-right">
                                <label class="form-control-label mt-2 pl-0" for="input-username">Signature </label>
                            </div>
                            <div class="col-8">
                                <div class="form-group">
                                    <input type="checkbox" class="" formControlName="IsSigned" [(ngModel)]="model.IsSigned">
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="col-sm-4">
                        <div class="img-box">
                            <div class="col-sm-12" *ngIf="model.Attachment!=''">
                                <img [src]="AttachImage" style="width: 80px;height: 80px;border-radius: 50%;display: table;" />
                            </div>
                            <File-Component class="UploadActnWrap" [(ngModel)]="model.Attachment" (ClearModel)="ClearImageUrl()" (FileNameEvent)="getImageUrlName($event)" (IsNewFileEvents1)="IsNewImageEvent($event)" [ImageWithAddress]="true" [ngModelOptions]="{standalone:true}"></File-Component>
                        </div>
                    </div>
                </div>
                <div class="modalfooter border-top mt-3">
                    <div class="row mt-2">
                        <div class="col-sm-6">
                            <button type="button" class="btn btn-red btnDel pull-left" *ngIf="IsEdit && ControlRights.DeleteRights" (click)="Delete()">Delete</button>

                        </div>

                        <div class="col-sm-6 text-right">
                            <button type="submit" class="btn btn-primary" *ngIf="!IsEdit && ControlRights.CreateRights">Save</button>
                            <button type="submit" class="btn btn-primary" *ngIf="IsEdit && ControlRights.EditRights">Update</button>
                            <button type="button" class="btn btn-light ml-2" routerLink="/home/EventRegister">Cancel</button>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
