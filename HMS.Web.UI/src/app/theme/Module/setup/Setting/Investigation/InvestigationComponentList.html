<div class="margin-t-68 removeAction">
    <div class="row headSection paginationHead">
        <div class="col-sm-8">
            <div class="row">
                <div class="col max-content">
                    <h3 class="page-heading mt-d-inline-block">
                        Investigation
                    </h3>
                </div>

            </div>

        </div>
        <div class="col-sm-4 text-right flex-row flex-end">
            <a class="btn btn-light mr-1" routerLink="/home/setup">Back</a>
            <a class="btn btn-danger" *ngIf="ControlRights.CreateRights" (click)="AddRecord('0',false)">New Investigation</a>
        </div>
    </div>


    <div>
        <div class="Cardview search_onTop search_large_left px-2">
            <app-pagination [PModel]="PModel" [PConfig]="PConfig" [PData]="InvestigationList" (pageChange)="GetList()" (AddOrEditEvent)="AddRecord($event)" (ViewEvent)="View($event)" (GoBackEvent)="GoBack($event)" (DeleteEvent)="Delete($event)" (ExportEvent)="ExportData($event)"></app-pagination>

        </div>

    </div>

</div>









<ng-template #InvestigationModal let-modal>
    <div class="modal-header">
        <h4 class="modal-title">
            {{ IsEdit ? 'Update Investigation' : 'Add Investigation' }}
        </h4>

        <button type="button" class="close" (click)="modal.dismiss()">
            <span>&times;</span>
        </button>
    </div>

    <form [formGroup]="Form1" (ngSubmit)="SaveOrUpdate(Form1.valid)">

        <div class="modal-body">

            <!-- Investigation -->
            <div class="form-group row align-items-center">
                <label class="col-md-3 col-form-label text-md-right">
                    Investigation
                </label>

                <div class="col-md-9">
                    <input type="text"
                           class="form-control"
                           formControlName="Investigation"
                           [(ngModel)]="model.Investigation"
                           placeholder="Investigation">

                    <small class="text-danger"
                           *ngIf="submitted && Form1.controls.Investigation.errors?.required">
                        This value is required.
                    </small>
                </div>
            </div>

            <!-- Category -->
            <div class="form-group row align-items-center">
                <label class="col-md-3 col-form-label text-md-right">
                    Category
                </label>

                <div class="col-md-9">
                    <input type="text"
                           id="CategorySearch"
                           class="form-control"
                           formControlName="CategoryId"
                           [(ngModel)]="model.CategoryName"
                           (click)="LoadCategory()"
                           autocomplete="off"
                           placeholder="e.g. Biochemistry">

                    <small class="text-danger"
                           *ngIf="submitted && Form1.controls.CategoryId.errors?.required">
                        This value is required.
                    </small>
                </div>
            </div>

            <!-- Sample -->
            <div class="form-group row align-items-center">
                <label class="col-md-3 col-form-label text-md-right">
                    Sample
                </label>

                <div class="col-md-9">
                    <input type="text"
                           id="SampleSearch"
                           class="form-control"
                           formControlName="SampleId"
                           [(ngModel)]="model.SampleName"
                           (click)="LoadSample()"
                           autocomplete="off"
                           placeholder="e.g. Blood, Urine">

                    <small class="text-danger"
                           *ngIf="submitted && Form1.controls.SampleId.errors?.required">
                        This value is required.
                    </small>
                </div>
            </div>

            <!-- TAT -->
            <div class="form-group row align-items-center">
                <label class="col-md-3 col-form-label text-md-right">
                    TAT
                </label>

                <div class="col-md-9">
                    <input type="text"
                           class="form-control"
                           formControlName="TAT"
                           [(ngModel)]="model.TAT"
                           placeholder="e.g. 2-4 hours">
                </div>
            </div>

            <!-- Price -->
            <div class="form-group row align-items-center">
                <label class="col-md-3 col-form-label text-md-right">
                    Price
                </label>

                <div class="col-md-9">
                    <input type="number"
                           class="form-control"
                           formControlName="Price"
                           [(ngModel)]="model.Price"
                           min="0"
                           placeholder="500">

                    <small class="text-danger"
                           *ngIf="submitted && Form1.controls.Price.errors?.required">
                        This value is required.
                    </small>
                </div>
            </div>

        </div>

        <div class="modal-footer justify-content-center">

            <button class="btn btn-primary"
                    type="submit"
                    *ngIf="!IsEdit && ControlRights.CreateRights">
                Save
            </button>

            <button class="btn btn-primary"
                    type="submit"
                    *ngIf="IsEdit && ControlRights.EditRights">
                Update
            </button>

            <button class="btn btn-danger"
                    type="button"
                    *ngIf="IsEdit && ControlRights.DeleteRights"
                    (click)="Delete()">
                Delete
            </button>

            <button class="btn btn-light"
                    type="button"
                    (click)="modal.close()">
                Close
            </button>

        </div>

    </form>
</ng-template>
