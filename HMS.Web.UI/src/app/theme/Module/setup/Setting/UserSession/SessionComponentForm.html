
<div class="margin-t-68 col-sm-12" style="margin-bottom:100px;">
    <div class="row headSection paginationHead">
        <div class="col-sm-8 no-padding">
            <h3 class="page-heading mt-d-inline-block">
                Session
                <a routerLink="/home/session"><i class="fa fa-arrow-circle-left"></i></a>
            </h3>
        </div>
        <div class="col-sm-4 text-right flex-row flex-end">
            <span class="closeICon" routerLink="/home/session">
            </span>
        </div>
    </div>
    <div class="Cardview p-4">
        <form [formGroup]="Form1" novalidate (ngSubmit)="SaveOrUpdate(Form1.valid)">
            <div class="AddNewItem margin-t-15">

                <div class="row form-group">
                    <div class="col-sm-2 text-right">
                        <label class="form-control-label mt-2 required" for="input-username"> Shift Start Date/ Time</label>
                    </div>
                    <div class="col-4">
                        <Datetime-Component formControlName="ShiftStartTime" placeholder="DD/MM/YYYY" [(ngModel)]="model.ShiftStartTime">
                        </Datetime-Component>
                        <small class="text-danger" *ngIf="Form1.controls.ShiftStartTime.hasError('required') && submitted">
                            This value is required.
                        </small>
                    </div>
                    <div class="col-4">
                        <input type="text" formControlName="StartTime" [(ngModel)]="model.StartTime" (click)="SelectTime()" (change)="ChangeSelectTime()" class="form-control" id="TimeRecorded" autocomplete="off">
                        <small class="text-danger" *ngIf="Form1.controls.StartTime.hasError('required') && submitted">
                            This value is required.
                        </small>
                    </div>

                </div>
                <div class="row form-group">
                    <div class="col-sm-2 text-right">
                        <label class="required">Starting Cash</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" formControlName="StartingCash" [(ngModel)]="model.StartingCash" class="form-control input-sm">
                    </div>
                </div>
                <div class="row form-group">
                    <div class="col-sm-2 text-right">
                        <label class="required">Opening Comments</label>
                    </div>
                    <div class="col-sm-4">
                        <input type="text" formControlName="OpeningComments" [(ngModel)]="model.OpeningComments" class="form-control input-sm">
                    </div>
                </div>
            </div>
            <div class="btnArea-footer btnFixed dropup">
                <button type="submit" class="btn btn-primary" *ngIf="!IsEdit && ControlRights.CreateRights">Save</button>
                <button type="submit" class="btn btn-primary" *ngIf="IsEdit && ControlRights.EditRights">Update</button>
                <button type="button" class="btn btn-red btnDel pull-left" *ngIf="IsEdit && ControlRights.DeleteRights" (click)="Delete()">Delete</button>
                <button type="button" class="btn btn-light" routerLink="/home/session">Cancel</button>
            </div>
        </form>
    </div>
</div>
