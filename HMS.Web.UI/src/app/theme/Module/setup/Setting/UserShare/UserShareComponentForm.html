<div class="col-sm-12 AddRoleWraper">
    <div class="row headSection paginationHead">
        <div class="col-sm-8 no-padding">
            <h3 class="page-heading mt-d-inline-block" *ngIf="IsEdit">
                Update Share
                <a routerLink="/home/setup"><i class="fa fa-arrow-circle-left"></i></a>
            </h3>
            <h3 class="page-heading mt-d-inline-block" *ngIf="IsEdit==false">
                New Share
                <a routerLink="/home/setup"><i class="fa fa-arrow-circle-left"></i></a>
            </h3>
        </div>
    </div>
    <div class="tab-pane" id="Charges">
        <div class="row">
            <div class="col">
                <div class="tab-pane active" id="Charges">
                    <div class="col-sm-12 CustomAccordion">
                        <form [formGroup]="Form1" novalidate (ngSubmit)="SaveOrUpdate(Form1.valid)">
                            <div class="row">
                                <div class="col-sm-3">
                                    <div class="form-group">
                                        <label>Doctor Name</label>
                                        <select class="form-control form-control-sm form-control-alternative" formControlName="DoctorId" [(ngModel)]="model.DoctorId">
                                            <option *ngFor="let item of DoctorList" [value]="item.ID">
                                                {{item.Name}}
                                            </option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <ngb-accordion [closeOthers]="true" activeIds="">
                                <ngb-panel id="charges-1">
                                    <ng-template ngbPanelTitle>
                                        <span>
                                            <img src="../assets/app/media/img/icons/apptime.png" class="img-fluid radius">
                                            General Expense (%)
                                        </span><i class="icon-chevron-right iconImage"></i>
                                    </ng-template>
                                    <ng-template ngbPanelContent>
                                        <div class="row">
                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Doctor Share (%)</label>
                                                    <input type="text" class="form-control ml-1" formControlName="GeneralDoctorShare" [(ngModel)]="model.GeneralDoctorShare" min="0" max="100" (ngModelChange)="generalLimitShare('D')" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" />
                                                </div>
                                            </div>
                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Owner Share (%)</label>
                                                    <input type="text" class="form-control ml-1" formControlName="GeneralOwnerShare" [(ngModel)]="model.GeneralOwnerShare" min="0" max="100" (ngModelChange)="generalLimitShare('O')" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" />
                                                </div>
                                            </div>
                                            <div class="modal-footer" *ngIf="!IsEdit && ControlRights.CreateRights">
                                                <button type="submit" class="btn btn-primary btn-xs">Add & Save</button>
                                            </div>
                                            <div class="modal-footer" *ngIf="IsEdit && ControlRights.EditRights">
                                                <button type="submit" class="btn btn-primary btn-xs">Update & Save</button>
                                            </div>
                                        </div>
                                    </ng-template>
                                </ngb-panel>
                                <ngb-panel id="charges-2">
                                    <ng-template ngbPanelTitle>
                                        <span>
                                            <img src="../assets/app/media/img/icons/history.png" class="img-fluid radius">
                                            Procedure (%)
                                        </span><i class="icon-chevron-right iconImage"></i>
                                    </ng-template>
                                    <ng-template ngbPanelContent>
                                        <div class="row">
                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Doctor Share (%)</label>
                                                    <input type="text" class="form-control ml-1" formControlName="ProcedureDoctorShare" [(ngModel)]="model.ProcedureDoctorShare" min="0" max="100" (ngModelChange)="procedureLimitShare('D')" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" />
                                                </div>
                                            </div>
                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Owner Share (%)</label>
                                                    <input type="text" class="form-control ml-1" formControlName="ProcedureOwnerShare" [(ngModel)]="model.ProcedureOwnerShare" min="0" max="100" (ngModelChange)="procedureLimitShare('O')" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" />
                                                </div>
                                            </div>
                                            <div class="modal-footer" *ngIf="!IsEdit && ControlRights.CreateRights">
                                                <button type="submit" class="btn btn-primary btn-xs">Add & Save</button>
                                            </div>
                                            <div class="modal-footer" *ngIf="IsEdit && ControlRights.EditRights">
                                                <button type="submit" class="btn btn-primary btn-xs">Update & Save</button>
                                            </div>
                                        </div>
                                    </ng-template>
                                </ngb-panel>
                                <ngb-panel id="charges-3">
                                    <ng-template ngbPanelTitle>
                                        <span>
                                            <img src="../assets/app/media/img/icons/history.png" class="img-fluid radius">
                                            Discount (%)
                                        </span><i class="icon-chevron-right iconImage"></i>
                                    </ng-template>
                                    <ng-template ngbPanelContent>
                                        <div class="row">
                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Doctor Share (%)</label>
                                                    <input type="text" class="form-control ml-1" formControlName="DiscountDoctorShare" [(ngModel)]="model.DiscountDoctorShare" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" />
                                                </div>
                                            </div>
                                            <div class="col-sm-3">
                                                <div class="form-group">
                                                    <label>Owner Share (%)</label>
                                                    <input type="text" class="form-control ml-1" formControlName="DiscountOwnerShare" [(ngModel)]="model.DiscountOwnerShare" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" />
                                                </div>
                                            </div>
                                            <div class="modal-footer" *ngIf="!IsEdit && ControlRights.CreateRights">
                                                <button type="submit" class="btn btn-primary btn-xs">Add & Save</button>
                                            </div>
                                            <div class="modal-footer" *ngIf="IsEdit && ControlRights.EditRights">
                                                <button type="submit" class="btn btn-primary btn-xs">Update & Save</button>
                                            </div>
                                        </div>

                                    </ng-template>
                                </ngb-panel>

                            </ngb-accordion>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
